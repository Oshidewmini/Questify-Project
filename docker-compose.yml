version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: questify_postgres
    restart: always
    environment:
      POSTGRES_USER: questify_user
      POSTGRES_PASSWORD: questify_password
      POSTGRES_DB: questify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: questify_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
